<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axolotl AR Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #panel { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9999; padding: 18px; box-sizing: border-box; color: white; background: rgba(15,20,30,0.9); border-radius: 16px; pointer-events: none; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; line-height: 1.45; font-size: 15px; }
  </style>
  <script>
    AFRAME.registerComponent("axolotl-test", {
      init: function () {
        this.ready = false;
        this.failed = false;
        this.tracked = false;
        this.status = document.getElementById("status");
        const target = this.el.parentElement;

        this.onFound = () => { this.tracked = true; this.updateStatus(); };
        this.onLost = () => { this.tracked = false; this.updateStatus(); };
        target.addEventListener("targetFound", this.onFound);
        target.addEventListener("targetLost", this.onLost);

        this.el.addEventListener("model-loaded", () => {
          try {
            const THREE = AFRAME.THREE;
            const model = this.el.getObject3D("mesh");
            // Measure in model coordinates, separately from the AR placement.
            this.el.removeObject3D("mesh");
            model.updateMatrixWorld(true);
            model.traverse((object) => {
              if (object.isSkinnedMesh) {
                object.skeleton.update();
                object.computeBoundingBox();
                object.computeBoundingSphere();
              }
            });
            const bounds = new THREE.Box3().setFromObject(model);
            const size = bounds.getSize(new THREE.Vector3());
            const center = bounds.getCenter(new THREE.Vector3());
            const footprint = Math.max(size.x, size.z);
            if (bounds.isEmpty() || !Number.isFinite(footprint) || footprint <= 0) {
              throw new Error("The model has no measurable geometry.");
            }

            // Longest horizontal dimension is 80% of the target image width.
            const scale = 0.8 / footprint;
            const content = new THREE.Group();
            content.name = "CenteredAxolotl";
            content.add(model);
            model.position.x -= center.x;
            model.position.y -= bounds.min.y;
            model.position.z -= center.z;
            content.scale.setScalar(scale);
            this.el.setObject3D("mesh", content);
            this.ready = true;
            this.updateStatus();
          } catch (error) {
            console.error("Axolotl placement error:", error);
            this.failed = true;
            this.status.textContent = "Model loaded, but placement failed: " + error.message;
          }
        });

        this.el.addEventListener("model-error", (event) => {
          this.failed = true;
          console.error("Axolotl model loading error:", event.detail);
          this.status.textContent = "Axolotl failed to load. Check the filename and browser Console.";
        });
      },
      updateStatus: function () {
        if (this.failed) return;
        this.status.textContent = !this.ready
          ? "Loading axolotl…"
          : this.tracked
            ? "Target found! Move your phone to view the axolotl."
            : "Axolotl loaded! Point your camera at the same target picture.";
      },
      remove: function () {
        this.el.parentElement.removeEventListener("targetFound", this.onFound);
        this.el.parentElement.removeEventListener("targetLost", this.onLost);
      }
    });
  </script>
</head>
<body>
  <div id="panel">
    <h1>Axolotl AR Test</h1>
    <p id="status">Loading axolotl…</p>
  </div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind?v=6; filterMinCF: 0.001; filterBeta: 10;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.5"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity rotation="90 0 0" position="0 0 0.05">
        <a-entity axolotl-test gltf-model="url(./Axolotl.glb?v=11)"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
