<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Room AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind?v=4;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="60000">
            <a-asset-item
                id="room-model"
                src="./ARRoom.glb?v=4">
            </a-asset-item>
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            light="type: ambient; intensity: 1">
        </a-entity>

        <a-entity
            light="type: directional; intensity: 1"
            position="1 2 3">
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-box
                position="0 0 0.1"
                width="0.1"
                height="0.1"
                depth="0.1"
                material="color: #FF00FF; shader: flat">
            </a-box>

            <a-gltf-model
                src="#room-model"
                position="0 0 0"
                rotation="90 0 0"
                scale="0.1 0.1 0.1">
            </a-gltf-model>

        </a-entity>

    </a-scene>
</body>
</html>
