<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Room AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 9999;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font: 16px Arial, sans-serif;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>

    <script>
        AFRAME.registerComponent("model-status", {
            init: function () {
                const status = document.getElementById("status");

                this.el.addEventListener("model-loaded", () => {
                    status.textContent =
                        "Room loaded! Point the camera at your target picture.";

                    const model = this.el.getObject3D("mesh");

                    model.traverse((object) => {
                        if (!object.isMesh) return;

                        const materials = Array.isArray(object.material)
                            ? object.material
                            : [object.material];

                        materials.forEach((material) => {
                            if (!material) return;

                            material.side = AFRAME.THREE.DoubleSide;
                            material.needsUpdate = true;
                        });
                    });
                });

                this.el.addEventListener("model-error", () => {
                    status.textContent =
                        "Room failed to load. Check the browser Console.";
                });
            }
        });
    </script>
</head>

<body>
    <div id="status">Loading room…</div>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind?v=6;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            light="type: ambient; intensity: 1.5">
        </a-entity>

        <a-entity
            light="type: directional; intensity: 1"
            position="1 2 3">
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity
                model-status
                gltf-model="url(./ARRoom_fixed.glb?v=6)"
                position="0 0 0.05"
                rotation="90 0 0"
                scale="0.08 0.08 0.08">
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
